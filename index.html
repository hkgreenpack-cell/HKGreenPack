<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPWR 歐盟包裝合規檢測系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4 sm:px-6">
  <div id="reportArea" class="max-w-3xl mx-auto space-y-6 bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
    
    <!-- Title -->
    <header class="text-center mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">PPWR 歐盟包裝合規檢測系統</h1>
    </header>

    <!-- Top Tabs -->
    <div class="grid grid-cols-2 gap-3 p-1.5 bg-slate-100 rounded-xl border border-slate-200">
      <button id="tabSecondary" onclick="switchTab('secondary')" class="py-3 px-4 rounded-lg font-medium text-center transition-all bg-blue-600 text-white shadow-sm">
        <div class="text-base font-bold">二級 / 運輸包裝 (Secondary)</div>
        <div class="text-xs opacity-90 font-normal">空隙率 50% 限值 (Art. 24)</div>
      </button>
      <button id="tabPrimary" onclick="switchTab('primary')" class="py-3 px-4 rounded-lg font-medium text-center transition-all text-slate-600 hover:bg-slate-200/60">
        <div class="text-base font-bold">一級 / 銷售包裝 (Primary)</div>
        <div class="text-xs opacity-75 font-normal">包裝極小化 (Art. 10)</div>
      </button>
    </div>

    <!-- Section 0: 基本資訊與 Logo -->
    <div class="p-5 border border-slate-200 rounded-xl bg-slate-50/50 space-y-4">
      <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">基本資訊與 Logo</div>
      <div class="grid sm:grid-cols-2 gap-3">
        <input type="text" id="companyName" placeholder="公司 / 品牌名稱" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <input type="text" id="skuId" placeholder="產品 / 包裝編號 (SKU ID)" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs text-slate-600 mb-1">上傳公司 Logo (將自動嵌入 PDF 報表右上角)：</label>
        <div class="flex items-center gap-3">
          <input type="file" id="logoUpload" accept="image/*" onchange="handleLogoUpload(event)" class="text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-200 file:text-slate-700 hover:file:bg-slate-300 cursor-pointer">
          <img id="logoPreview" class="h-8 object-contain hidden" alt="Logo Preview">
        </div>
      </div>
    </div>

    <!-- Section 1: 外箱尺寸 -->
    <div class="p-5 border border-slate-200 rounded-xl bg-slate-50/50 space-y-3">
      <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">1. 外箱尺寸 (cm)</div>
      <div class="grid grid-cols-3 gap-3">
        <input type="number" id="boxL" placeholder="長 L" oninput="calculate()" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm text-center focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <input type="number" id="boxW" placeholder="闊 W" oninput="calculate()" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm text-center focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <input type="number" id="boxH" placeholder="高 H" oninput="calculate()" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm text-center focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
    </div>

    <!-- Section 2: 裝載商品清單 (支援多 SKU) -->
    <div class="p-5 border border-slate-200 rounded-xl bg-slate-50/50 space-y-3">
      <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">2. 裝載商品清單 (支援多 SKU)</div>
      <div id="skuContainer" class="space-y-3">
        <!-- SKU Rows will be injected here -->
      </div>
      <button onclick="addSkuRow()" class="w-full py-2.5 border-2 border-dashed border-blue-300 text-blue-600 font-medium text-sm rounded-xl hover:bg-blue-50/50 transition flex items-center justify-center gap-1">
        <span>+ 新增商品 SKU</span>
      </button>
    </div>

    <!-- Section 3: 緩衝材 / 內咭扣除 -->
    <div class="p-5 border border-slate-200 rounded-xl bg-slate-50/50 space-y-3">
      <div id="sec3Title" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">3. 緩衝材 / 內咭扣除 (Art. 24：緩衝物全數計入空隙)</div>
      <select id="bufferType" onchange="calculate()" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <option value="none">無緩衝材 / 不扣除</option>
        <option value="bubble">氣泡紙 / 塑膠氣墊 (全數計入空隙)</option>
        <option value="paper">紙質蜂巢 / 碎紙 (全數計入空隙)</option>
        <option value="custom">客製化固定紙咭 (符合特定結構可申請不扣除)</option>
      </select>
    </div>

    <!-- Dynamic Result Display -->
    <div id="resultBox" class="p-6 rounded-xl bg-slate-100 text-slate-500 text-center font-medium transition-all">
      請輸入外盒與至少一件產品的尺寸數據
    </div>

    <!-- Export PDF Button Container (Hidden until calculated) -->
    <div id="actionContainer" class="hidden text-right">
      <button onclick="exportPDF()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg shadow-sm transition">
        📄 下載 PDF 檢測報告
      </button>
    </div>

  </div>

  <script>
    let currentMode = 'secondary';
    let skuCount = 0;
    let logoDataUrl = '';

    function switchTab(mode) {
      currentMode = mode;
      const tabSec = document.getElementById('tabSecondary');
      const tabPri = document.getElementById('tabPrimary');
      const sec3Title = document.getElementById('sec3Title');

      if (mode === 'secondary') {
        tabSec.className = "py-3 px-4 rounded-lg font-medium text-center transition-all bg-blue-600 text-white shadow-sm";
        tabPri.className = "py-3 px-4 rounded-lg font-medium text-center transition-all text-slate-600 hover:bg-slate-200/60";
        sec3Title.innerText = "3. 緩衝材 / 內咭扣除 (Art. 24：緩衝物全數計入空隙)";
      } else {
        tabPri.className = "py-3 px-4 rounded-lg font-medium text-center transition-all bg-blue-600 text-white shadow-sm";
        tabSec.className = "py-3 px-4 rounded-lg font-medium text-center transition-all text-slate-600 hover:bg-slate-200/60";
        sec3Title.innerText = "3. 包裝極小化評估 (Art. 10：必要防護空間說明)";
      }
      calculate();
    }

    function addSkuRow(name = '', l = '', w = '', h = '', qty = 1) {
      skuCount++;
      const id = `sku_row_${skuCount}`;
      const html = `
        <div id="${id}" class="grid grid-cols-12 gap-2 items-center">
          <input type="text" placeholder="SKU 名稱/編號" value="${name}" class="col-span-4 p-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" oninput="calculate()">
          <input type="number" placeholder="長 L" value="${l}" class="col-span-2 p-2.5 bg-white border border-slate-300 rounded-lg text-sm text-center focus:ring-2 focus:ring-blue-500 focus:outline-none" oninput="calculate()">
          <input type="number" placeholder="闊 W" value="${w}" class="col-span-2 p-2.5 bg-white border border-slate-300 rounded-lg text-sm text-center focus:ring-2 focus:ring-blue-500 focus:outline-none" oninput="calculate()">
          <input type="number" placeholder="高 H" value="${h}" class="col-span-2 p-2.5 bg-white border border-slate-300 rounded-lg text-sm text-center focus:ring-2 focus:ring-blue-500 focus:outline-none" oninput="calculate()">
          <input type="number" placeholder="數量" value="${qty}" min="1" class="col-span-1 p-2.5 bg-white border border-slate-300 rounded-lg text-sm text-center focus:ring-2 focus:ring-blue-500 focus:outline-none" oninput="calculate()">
          <button onclick="removeSkuRow('${id}')" class="col-span-1 text-slate-400 hover:text-red-500 text-lg font-bold text-center">×</button>
        </div>
      `;
      document.getElementById('skuContainer').insertAdjacentHTML('beforeend', html);
      calculate();
    }

    function removeSkuRow(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
      calculate();
    }

    function handleLogoUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          logoDataUrl = e.target.result;
          const preview = document.getElementById('logoPreview');
          preview.src = logoDataUrl;
          preview.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function calculate() {
      const boxL = parseFloat(document.getElementById('boxL').value) || 0;
      const boxW = parseFloat(document.getElementById('boxW').value) || 0;
      const boxH = parseFloat(document.getElementById('boxH').value) || 0;

      const boxVol = boxL * boxW * boxH;

      // Calculate total product volume from dynamic SKU rows
      let totalProdVol = 0;
      let hasValidSku = false;

      const skuRows = document.getElementById('skuContainer').children;
      for (let row of skuRows) {
        const inputs = row.querySelectorAll('input');
        const l = parseFloat(inputs[1].value) || 0;
        const w = parseFloat(inputs[2].value) || 0;
        const h = parseFloat(inputs[3].value) || 0;
        const q = parseInt(inputs[4].value) || 1;

        if (l > 0 && w > 0 && h > 0) {
          totalProdVol += (l * w * h * q);
          hasValidSku = true;
        }
      }

      const resultBox = document.getElementById('resultBox');
      const actionContainer = document.getElementById('actionContainer');

      if (boxVol <= 0 || !hasValidSku) {
        resultBox.className = "p-6 rounded-xl bg-slate-100 text-slate-500 text-center font-medium";
        resultBox.innerHTML = "請輸入外盒與至少一件產品的尺寸數據";
        actionContainer.classList.add('hidden');
        return;
      }

      const voidVol = Math.max(0, boxVol - totalProdVol);
      const voidRatio = Math.round((voidVol / boxVol) * 100);
      const limit = currentMode === 'secondary' ? 50 : 40; // Art. 24 limit is 50%
      const isPass = voidRatio <= limit;

      actionContainer.classList.remove('hidden');

      if (isPass) {
        resultBox.className = "p-6 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 space-y-2";
        resultBox.innerHTML = `
          <div class="text-lg font-bold text-emerald-600">✅ 檢測結果：符合 PPWR 規章要件 (${voidRatio}% ≤ ${limit}% 限值)</div>
          <div class="text-sm text-emerald-800">
            外箱總體積：<b>${boxVol.toLocaleString()}</b> cm³ | 商品總體積：<b>${totalProdVol.toLocaleString()}</b> cm³ | 空隙率：<b>${voidRatio}%</b>
          </div>
        `;
      } else {
        resultBox.className = "p-6 rounded-xl bg-red-50 border border-red-200 text-red-900 space-y-2";
        resultBox.innerHTML = `
          <div class="text-lg font-bold text-red-600">❌ 檢測結果：空隙率超標 (${voidRatio}% > ${limit}% 限值)</div>
          <div class="text-sm text-red-800">
            外箱總體積：<b>${boxVol.toLocaleString()}</b> cm³ | 商品總體積：<b>${totalProdVol.toLocaleString()}</b> cm³ | 空隙率：<b>${voidRatio}%</b>
          </div>
          <div class="text-xs text-red-700 mt-1">建議：縮減外箱尺寸，或調整裝載商品組合以降低空隙率。</div>
        `;
      }
    }

    function exportPDF() {
      const element = document.getElementById('reportArea');
      const company = document.getElementById('companyName').value || 'N/A';
      const sku = document.getElementById('skuId').value || 'N/A';

      const opt = {
        margin:       8,
        filename:     `PPWR_Compliance_${company}_${sku}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }

    // Initialize with 1 default SKU row
    addSkuRow('', '', '', '', 1);
  </script>
</body>
</html>
